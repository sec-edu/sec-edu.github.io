<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty & Researchers</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      background: #f8f9fa;
      color: #1e293b;
    }

    section {
      width: 100%;
      padding: 5rem 0;
    }

    .section-inner {
      max-width: 1000px;
      margin: auto;
      padding: 0 2rem;
    }

    h2 {
      font-size: 2rem;
      margin-bottom: 2rem;
    }

    .faculty-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
    }

    .faculty-card {
      display: block;
      background: white;
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .faculty-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.1);
    }

    .faculty-card h3 {
      margin-bottom: 0.5rem;
    }

    .back {
      display: inline-block;
      margin-bottom: 2rem;
      text-decoration: none;
      color: #2563eb;
      font-weight: 600;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f8f9fa;
      margin: 0;
      color: #1e293b;
    }

    nav {
      position: fixed;
      width: 100%;
      top: 0;
      background: white;
      display: flex;
      justify-content: center;
      padding: 1rem;
      border-bottom: 1px solid #e2e8f0;
      z-index: 1000;
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #1e293b;
      font-weight: 600;
    }

    nav a:hover {
      color: #2563eb;
    }

    .container {
      padding: 100px 2rem 4rem;
      max-width: 1200px;
      margin: auto;
    }

    h1 {
      margin-bottom: 2rem;
      text-align: center;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
    }

    .video-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: 0.3s;
    }

    .video-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.12);
    }

    .video-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .video-card p {
      padding: 1rem;
      text-align: center;
      font-weight: 600;
    }

    .video-responsive {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }

    .video-responsive iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      border: none;
    }

    footer {
      text-align: center;
      padding: 2rem;
      background: #1a252f;
      color: #bdc3c7;
      margin-top: 3rem;
    }
  </style>
</head>
